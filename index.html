<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🚗 媛媛的路上名車大冒險 🏎️</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#10B981">
  <meta name="mobile-web-app-capable" content="yes">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .btn-jelly { transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .btn-jelly:active { transform: scale(0.94) translateY(3px); }
  </style>
</head>
<body class="bg-gradient-to-b from-emerald-50 via-teal-50 to-amber-50 h-[100dvh] overflow-hidden flex flex-col justify-between p-3 select-none">

  <!-- 頂部資訊列 -->
  <header class="flex items-center justify-between px-2 pt-1 pb-2">
    <div class="flex items-center gap-2 bg-white/90 backdrop-blur-md px-3.5 py-1.5 rounded-full shadow-sm border border-emerald-200">
      <span class="text-xl">🏆</span>
      <span id="star-count" class="text-lg font-bold text-emerald-600">0</span>
      <span class="text-xs text-gray-400 font-semibold">/ <span id="deck-progress">16</span></span>
    </div>

    <div class="flex items-center gap-2">
      <span class="text-xs font-bold bg-white/80 border border-teal-200 text-teal-700 px-2.5 py-1 rounded-full shadow-sm">
        🟢 本機真實標誌
      </span>
      <button id="btn-sound" onclick="toggleAudio()" class="btn-jelly w-9 h-9 bg-white/90 border border-emerald-200 rounded-full flex items-center justify-center text-base shadow-sm">
        🔊
      </button>
    </div>
  </header>

  <!-- 中間：3D 翻轉車標卡片 -->
  <main class="flex-1 flex flex-col items-center justify-center px-1 perspective-1000 max-h-[72vh]">
    <div id="card-inner" class="relative w-full max-w-sm h-[410px] transition-transform duration-500 transform-style-3d">
      
      <!-- 正面：車標展示 -->
      <div class="absolute inset-0 w-full h-full bg-white rounded-3xl p-5 shadow-xl border-4 border-emerald-200 flex flex-col items-center justify-between backface-hidden">
        <div class="w-full flex justify-between items-center text-xs font-bold text-emerald-500">
          <span class="bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100">🏎️ 媛媛的第 <span id="current-index">1</span> 題</span>
          <span class="text-gray-300">Tap to Reveal</span>
        </div>

        <!-- 真實車標圖檔區 -->
        <div class="w-full flex-1 flex flex-col items-center justify-center py-2">
          <div class="w-full aspect-square max-h-52 rounded-2xl bg-white border-2 border-slate-100 shadow-inner flex items-center justify-center p-6">
            <img id="logo-img" src="" alt="車標" class="max-h-40 max-w-[85%] object-contain filter drop-shadow">
          </div>
        </div>

        <div class="text-center pb-2">
          <p class="text-lg font-bold text-gray-700 animate-pulse">路上看過這個標誌嗎？這是什麼車？🤔</p>
          <p class="text-xs text-gray-400 mt-0.5">點擊下方按鈕揭曉答案</p>
        </div>
      </div>

      <!-- 背面：解答區 -->
      <div class="absolute inset-0 w-full h-full bg-white rounded-3xl p-5 shadow-xl border-4 border-amber-300 flex flex-col items-center justify-between backface-hidden rotate-y-180">
        <div class="w-full flex items-center justify-between">
          <span id="country-badge" class="text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-1 rounded-full"></span>
          <button onclick="speakCurrentCar()" class="btn-jelly bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-xs px-3.5 py-1.5 rounded-full font-bold flex items-center gap-1 border border-emerald-300">
            🔊 聽發音
          </button>
        </div>

        <div class="text-center my-1">
          <h2 id="car-zh" class="text-3xl font-black text-gray-800 tracking-wide"></h2>
          <p id="car-en" class="text-base font-bold text-teal-600 mt-0.5"></p>
        </div>

        <div class="w-full bg-gradient-to-tr from-emerald-50 via-amber-50 to-teal-50 rounded-2xl p-3 border border-amber-100 flex flex-col items-center justify-center text-center shadow-inner">
          <div id="car-icons" class="text-4xl py-1 filter drop-shadow-sm tracking-widest"></div>
          <p id="car-fact" class="text-xs font-bold text-gray-600 mt-2 px-2 leading-relaxed"></p>
        </div>

        <div class="text-center text-[11px] text-emerald-600 font-bold">
          🌟 下次走在路上，換媛媛找找看這台車！
        </div>
      </div>

    </div>
  </main>

  <!-- 底部按鈕區 -->
  <footer class="w-full max-w-sm mx-auto flex flex-col gap-2 pb-2 px-1">
    <div id="action-reveal" class="w-full">
      <button onclick="revealAnswer()" class="btn-jelly w-full py-4 bg-gradient-to-r from-emerald-400 to-teal-500 text-white font-black text-xl rounded-2xl shadow-lg border-b-4 border-teal-600 flex items-center justify-center gap-2">
        <span>👀</span> 看答案 (Reveal)
      </button>
    </div>

    <div id="action-next" class="w-full hidden grid grid-cols-3 gap-2">
      <button onclick="flipCard()" class="btn-jelly col-span-1 py-3.5 bg-gray-100 text-gray-700 font-bold text-sm rounded-2xl border-2 border-gray-200 flex items-center justify-center gap-1">
        🔄 翻轉
      </button>
      <button onclick="nextCar()" class="btn-jelly col-span-2 py-3.5 bg-gradient-to-r from-amber-400 to-orange-400 text-white font-black text-lg rounded-2xl shadow-md border-b-4 border-orange-500 flex items-center justify-center gap-1">
        <span>👉</span> 下一台車 (Next)
      </button>
    </div>
  </footer>

  <script>
    let audioCtx = null;
    let isSoundOn = true;

    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function toggleAudio() {
      isSoundOn = !isSoundOn;
      document.getElementById('btn-sound').textContent = isSoundOn ? '🔊' : '🔇';
    }

    function playPop() {
      if (!isSoundOn) return;
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const now = ctx.currentTime;
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(850, now + 0.08);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.08);
      } catch(e) {}
    }

    function playHorn() {
      if (!isSoundOn) return;
      try {
        const ctx = getAudio();
        [440, 554.37].forEach(f => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const now = ctx.currentTime;
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.22);
        });
      } catch(e) {}
    }

    function playFanfare() {
      if (!isSoundOn) return;
      try {
        const ctx = getAudio();
        [523.25, 659.25, 783.99, 1046.50].forEach(f => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const now = ctx.currentTime;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.5);
        });
      } catch(e) {}
    }

      },
      {
        file: "./logos/honda.png",
        zh: "本田",
        en: "Honda",
        origin: "🇯🇵 日本",
        icons: "🔤 🚗 🛵",
        fact: "經典大方的銀色『H』，不只會造省油耐用的休旅車，摩托車技術也是世界第一！"
      },
      {
        file: "./logos/subaru.png",
        zh: "速霸陸",
        en: "Subaru",
        origin: "🇯🇵 日本",
        icons: "✨ 🌌 🚙",
        fact: "深藍夜空中的六顆閃亮昴宿星團！四輪驅動爬山抓地力超級厲害！"
      }

    let deck = [];
    let currentIndex = 0;
    let stars = 0;
    let isFlipped = false;

    function initGame() {
      deck = [...CARS_DB].sort(() => Math.random() - 0.5);
      currentIndex = 0;
      stars = 0;
      document.getElementById('star-count').textContent = stars;
      document.getElementById('deck-progress').textContent = deck.length;
      loadCard(currentIndex);
    }

    function loadCard(idx) {
      if (idx >= deck.length) idx = 0;
      isFlipped = false;
      document.getElementById('card-inner').classList.remove('rotate-y-180');
      const data = deck[idx];
      document.getElementById('current-index').textContent = idx + 1;

      document.getElementById('logo-img').src = data.file;

      document.getElementById('country-badge').textContent = data.origin;
      document.getElementById('car-zh').textContent = data.zh;
      document.getElementById('car-en').textContent = data.en;
      document.getElementById('car-icons').textContent = data.icons;
      document.getElementById('car-fact').textContent = data.fact;

      document.getElementById('action-reveal').classList.remove('hidden');
      document.getElementById('action-next').classList.add('hidden');
    }

    function revealAnswer() {
      if (isFlipped) return;
      isFlipped = true;
      playHorn();
      document.getElementById('card-inner').classList.add('rotate-y-180');

      if (typeof confetti === 'function') {
        confetti({ particleCount: 35, spread: 60, origin: { y: 0.65 } });
      }

      stars++;
      document.getElementById('star-count').textContent = stars;
      if (stars % 5 === 0) playFanfare();

      document.getElementById('action-reveal').classList.add('hidden');
      document.getElementById('action-next').classList.remove('hidden');

      speakCurrentCar();
    }

    function flipCard() {
      playPop();
      isFlipped = !isFlipped;
      document.getElementById('card-inner').classList.toggle('rotate-y-180', isFlipped);
    }

    function nextCar() {
      playPop();
      currentIndex++;
      loadCard(currentIndex);
    }

    function speakCurrentCar() {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const data = deck[currentIndex];
      const uEn = new SpeechSynthesisUtterance(data.en);
      uEn.lang = 'en-US';
      uEn.rate = 0.9;
      const uZh = new SpeechSynthesisUtterance(data.zh);
      uZh.lang = 'zh-TW';
      window.speechSynthesis.speak(uEn);
      uEn.onend = () => setTimeout(() => window.speechSynthesis.speak(uZh), 120);
    }

    window.addEventListener('DOMContentLoaded', initGame);
  </script>
</body>
</html>
