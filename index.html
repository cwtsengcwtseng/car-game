<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🚗 媛媛的路上名車大冒險 🏎️</title>
  <meta name="theme-color" content="#10B981">
  <meta name="mobile-web-app-capable" content="yes">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .btn-jelly { transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .btn-jelly:active { transform: scale(0.94) translateY(3px); }
  </style>

<body class="bg-gradient-to-b from-emerald-50 via-teal-50 to-amber-50 h-[100dvh] overflow-hidden flex flex-col justify-between p-3 select-none">

        🔊

  <!-- 中間：3D 翻轉車標卡片 -->

        <div class="text-center pb-2">

            🔊 聽發音

        </div>

        <div class="text-center my-1">

  </main>

        <span>👀</span> 看答案 (Reveal)
      </button>
    </div>

    <div id="action-next" class="w-full hidden grid grid-cols-3 gap-2">
      <button onclick="flipCard()" class="btn-jelly col-span-1 py-3.5 bg-gray-100 text-gray-700 font-bold text-sm rounded-2xl border-2 border-gray-200 flex items-center justify-center gap-1">
        🔄 翻轉

      </button>
    </div>

  <script>
    /* 1. 音效引擎 */
    let audioCtx = null;
    let isSoundOn = true;

    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function toggleAudio() {
      isSoundOn = !isSoundOn;
      document.getElementById('btn-sound').textContent = isSoundOn ? '🔊' : '🔇';
    }

    function playPop() {
      if (!isSoundOn) return;
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const now = ctx.currentTime;
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(850, now + 0.08);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.08);
      } catch(e) {}
    }

    function playHorn() {
      if (!isSoundOn) return;
      try {
        const ctx = getAudio();
        [440, 554.37].forEach(f => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const now = ctx.currentTime;
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.22);
        });
      } catch(e) {}
    }

    function playFanfare() {
      if (!isSoundOn) return;
      try {
        const ctx = getAudio();
        [523.25, 659.25, 783.99, 1046.50].forEach(f => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const now = ctx.currentTime;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.5);
        });
      } catch(e) {}
    }

    /* 3. 遊戲邏輯 */
    let deck = [];
    let currentIndex = 0;
    let stars = 0;
    let isFlipped = false;

    function initGame() {
      deck = [...CARS_DB].sort(() => Math.random() - 0.5);
      currentIndex = 0;
      stars = 0;
      document.getElementById('star-count').textContent = stars;
      document.getElementById('deck-progress').textContent = deck.length;
      loadCard(currentIndex);
    }

    function loadCard(idx) {
      if (idx >= deck.length) idx = 0;
      isFlipped = false;
      document.getElementById('card-inner').classList.remove('rotate-y-180');
      const data = deck[idx];
      document.getElementById('current-index').textContent = idx + 1;

      // 載入 Base64 圖片
      document.getElementById('logo-img').src = data.logo;

      // 載入解答
      document.getElementById('country-badge').textContent = data.origin;
      document.getElementById('car-zh').textContent = data.zh;
      document.getElementById('car-en').textContent = data.en;
      document.getElementById('car-icons').textContent = data.icons;
      document.getElementById('car-fact').textContent = data.fact;

      // 重設按鈕
      document.getElementById('action-reveal').classList.remove('hidden');
      document.getElementById('action-next').classList.add('hidden');
    }

    function revealAnswer() {
      if (isFlipped) return;
      isFlipped = true;
      playHorn();
      document.getElementById('card-inner').classList.add('rotate-y-180');

      if (typeof confetti === 'function') {
        confetti({ particleCount: 35, spread: 60, origin: { y: 0.65 } });
      }

      stars++;
      document.getElementById('star-count').textContent = stars;
      if (stars % 5 === 0) playFanfare();

      document.getElementById('action-reveal').classList.add('hidden');
      document.getElementById('action-next').classList.remove('hidden');

      speakCurrentCar();
    }

    function flipCard() {
      playPop();
      isFlipped = !isFlipped;
      document.getElementById('card-inner').classList.toggle('rotate-y-180', isFlipped);
    }

    function nextCar() {
      playPop();
      currentIndex++;
      loadCard(currentIndex);
    }

    function speakCurrentCar() {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const data = deck[currentIndex];
      const uEn = new SpeechSynthesisUtterance(data.en);
      uEn.lang = 'en-US';
      uEn.rate = 0.9;
      const uZh = new SpeechSynthesisUtterance(data.zh);
      uZh.lang = 'zh-TW';
      window.speechSynthesis.speak(uEn);
      uEn.onend = () => setTimeout(() => window.speechSynthesis.speak(uZh), 120);
    }

    window.addEventListener('DOMContentLoaded', initGame);
  </script>
