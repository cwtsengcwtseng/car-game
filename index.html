    class SoundEngine {
      constructor() { this.ctx = null; this.enabled = true; }
      init() {
        try {
          if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch (e) {
          console.error(e);
        }
      }
      playPop() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.08);
      }
      playHorn() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        [440, 554.37].forEach(f => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.22);
        });
      }
      playFanfare() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        [523.25, 659.25, 783.99, 1046.50].forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.5);
        });
      }
    }

    let deck = [];
    let currentIndex = 0;
    let stars = 0;
    let isFlipped = false;

    function initGame() {
      deck = [...CARS_DB].sort(() => Math.random() - 0.5);
      currentIndex = 0;
      stars = 0;
      document.getElementById('star-count').textContent = stars;
      document.getElementById('deck-progress').textContent = deck.length;
      loadCard(currentIndex);
    }

    function loadCard(idx) {
      if (idx >= deck.length) idx = 0;
      isFlipped = false;
      document.getElementById('card-inner').classList.remove('rotate-y-180');
      const data = deck[idx];
      document.getElementById('current-index').textContent = idx + 1;

      // 載入正確圖片
      const img = document.getElementById('logo-img');
      img.src = data.logo;

      // 載入解答
      document.getElementById('country-badge').textContent = data.origin;
      document.getElementById('car-zh').textContent = data.zh;
      document.getElementById('car-en').textContent = data.en;
      document.getElementById('car-icons').textContent = data.icons;
      document.getElementById('car-fact').textContent = data.fact;

      // 重設按鈕
      document.getElementById('action-reveal').classList.remove('hidden');
      document.getElementById('action-next').classList.add('hidden');
    }

    function revealAnswer() {
      if (isFlipped) return;
      isFlipped = true;
      sound.playHorn();
      document.getElementById('card-inner').classList.add('rotate-y-180');

      if (typeof confetti === 'function') {
        confetti({ particleCount: 35, spread: 60, origin: { y: 0.65 } });
      }

      stars++;
      document.getElementById('star-count').textContent = stars;
      if (stars % 5 === 0) sound.playFanfare();

      document.getElementById('action-reveal').classList.add('hidden');
      document.getElementById('action-next').classList.remove('hidden');

      speakCurrentCar();
    }

    function flipCard() {
      sound.playPop();
      isFlipped = !isFlipped;
      document.getElementById('card-inner').classList.toggle('rotate-y-180', isFlipped);
    }

    function nextCar() {
      sound.playPop();
      currentIndex++;
      loadCard(currentIndex);
    }

    function speakCurrentCar() {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const data = deck[currentIndex];
      const uEn = new SpeechSynthesisUtterance(data.en);
      uEn.lang = 'en-US';
      uEn.rate = 0.9;
      const uZh = new SpeechSynthesisUtterance(data.zh);
      uZh.lang = 'zh-TW';
      window.speechSynthesis.speak(uEn);
      uEn.onend = () => setTimeout(() => window.speechSynthesis.speak(uZh), 120);
    }

    async function preloadAllLogos() {
      const btn = document.getElementById('btn-sync');
      btn.textContent = '快取中...';
      if ('caches' in window) {
        const cache = await caches.open('yuanyuan-cars-v1');
        for (const c of CARS_DB) {
          try {
            await cache.add(c.logo);
          } catch(e) {}
        }
        btn.textContent = '✅ 已完全離線';
        sound.playFanfare();
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }

    window.addEventListener('DOMContentLoaded', initGame);
